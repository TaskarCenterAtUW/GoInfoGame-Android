name: Gradle unit tests

on:
  push:
    branches:
      - "add-unit-tests"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  unit-test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v3

      # -PignoreTestFailures lets the build finish (and the Kover report tasks below still run)
      # even if some tests fail - actual pass/fail is reported from the JUnit XML below, not this
      # command's exit code
      - name: Run unit tests with Gradle
        run: ./gradlew test koverHtmlReport koverXmlReport -PignoreTestFailures=true

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit test results
          path: "app/build/test-results/testDebugUnitTest/*.xml"
          reporter: java-junit
          fail-on-error: true

      - name: Add coverage summary
        if: always()
        run: |
          report="app/build/reports/kover/report.xml"
          if [ -f "$report" ]; then
            line_counter=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$report" | tail -1)
            missed=$(echo "$line_counter" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
            covered=$(echo "$line_counter" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
            total=$((missed + covered))
            if [ "$total" -gt 0 ]; then
              pct=$(awk "BEGIN { printf \"%.1f\", ($covered/$total)*100 }")
              echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
              echo "Line coverage: **${pct}%** (${covered}/${total} lines)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # bundled into one file before upload - the unbundled reports (Kover's HTML report alone is
      # one page per class) add up to 300+ individual files, which was timing out
      # actions/upload-artifact's CreateArtifact call on this runner's connection.
      # tar.gz, not zip - actions/upload-artifact always wraps whatever it uploads in its own
      # container zip on download, so a raw .zip here became a same-named "unit-test-reports.zip"
      # nested inside GitHub's own "unit-test-reports.zip" wrapper - indistinguishable from a
      # corrupt/invalid file to anyone extracting it without realizing there's a second layer.
      # tar.gz doesn't collide with that outer zip, so what you get after one extract is
      # unambiguous.
      - name: Bundle test and coverage reports
        if: always()
        run: |
          mkdir -p artifact-bundle
          tar -czf artifact-bundle/unit-test-reports.tar.gz \
            app/build/reports/tests/testDebugUnitTest \
            app/build/test-results/testDebugUnitTest \
            app/build/reports/kover

      # uploaded once, then retried once in a separate step - actions/upload-artifact's
      # FinalizeArtifact call (a small metadata request made after the bytes are already
      # uploaded) intermittently times out on this runner's connection regardless of artifact
      # size (see actions/upload-artifact#531, #623, no fix from GitHub yet).
      # Not Wandalen/wretry.action: v4 artifacts are immutable and a failed attempt has already
      # run CreateArtifact, so the name is taken for this run and every re-attempt with the same
      # name was rejected ("an artifact with this name already exists") - the retry could never
      # succeed. overwrite: true lets the retry replace that half-created artifact.
      # compression-level: 0 since the bundle is already .tar.gz.
      # continue-on-error so a failed upload doesn't fail the whole job, since pass/fail is
      # already reported independently via dorny/test-reporter above
      - name: Upload test and coverage reports
        id: upload-reports
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: unit-test-reports
          path: artifact-bundle/unit-test-reports.tar.gz
          retention-days: 14
          overwrite: true
          compression-level: 0

      - name: Upload test and coverage reports (retry)
        uses: actions/upload-artifact@v4
        if: always() && steps.upload-reports.outcome == 'failure'
        continue-on-error: true
        with:
          name: unit-test-reports
          path: artifact-bundle/unit-test-reports.tar.gz
          retention-days: 14
          overwrite: true
          compression-level: 0
