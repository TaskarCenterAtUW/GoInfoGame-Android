name: Gradle unit tests

on:
  push:
    branches:
      - "add-unit-tests"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  unit-test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v3

      # -PignoreTestFailures lets the build finish (and the Kover report tasks below still run)
      # even if some tests fail - actual pass/fail is reported from the JUnit XML below, not this
      # command's exit code
      - name: Run unit tests with Gradle
        run: ./gradlew test koverHtmlReport koverXmlReport -PignoreTestFailures=true

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit test results
          path: "app/build/test-results/testDebugUnitTest/*.xml"
          reporter: java-junit
          fail-on-error: true

      - name: Add coverage summary
        if: always()
        run: |
          report="app/build/reports/kover/report.xml"
          if [ -f "$report" ]; then
            line_counter=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$report" | tail -1)
            missed=$(echo "$line_counter" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
            covered=$(echo "$line_counter" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
            total=$((missed + covered))
            if [ "$total" -gt 0 ]; then
              pct=$(awk "BEGIN { printf \"%.1f\", ($covered/$total)*100 }")
              echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
              echo "Line coverage: **${pct}%** (${covered}/${total} lines)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # zipped into one file before upload - the unzipped reports (Kover's HTML report alone is
      # one page per class) add up to 300+ individual files, which was timing out
      # actions/upload-artifact's CreateArtifact call on this runner's connection
      - name: Zip test and coverage reports
        if: always()
        run: |
          mkdir -p artifact-bundle
          zip -rq artifact-bundle/unit-test-reports.zip \
            app/build/reports/tests/testDebugUnitTest \
            app/build/test-results/testDebugUnitTest \
            app/build/reports/kover

      # wrapped in a retry - actions/upload-artifact's FinalizeArtifact call (a small metadata
      # request made after the bytes are already uploaded) intermittently times out on this
      # runner's connection regardless of artifact size (see actions/upload-artifact#531, #623,
      # no fix from GitHub yet) - continue-on-error so exhausting retries doesn't fail the whole
      # job, since pass/fail is already reported independently via dorny/test-reporter above
      - name: Upload test and coverage reports
        uses: Wandalen/wretry.action@v3.8.0
        if: always()
        continue-on-error: true
        with:
          action: actions/upload-artifact@v4
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            name: unit-test-reports
            path: artifact-bundle/unit-test-reports.zip
            retention-days: 14
