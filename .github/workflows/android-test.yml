name: Gradle Android tests

on:
  push:
    branches:
      - "add-unit-tests"
  workflow_dispatch:

jobs:
  android-test:
    runs-on: [self-hosted, macOS]
    strategy:
      max-parallel: 1 # multiple runners are registered on the same physical Mac - without this,
      # matrix legs can run concurrently and contend for the same real GPU, which is what was
      # causing "Failed to find ColorBuffer" emulator errors regardless of the -gpu backend used
      matrix:
        api-level:
          - 30 # min API with arm64-v8a system images
          - 34 # close to targetSdk, well-supported arm64-v8a image
        arch:
          - arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.arch }}-${{ matrix.api-level }}-google-apis-swiftshader

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching." && killall -INT crashpad_handler || true

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            test_exit_code=$?
            killall -INT crashpad_handler || true
            exit $test_exit_code
