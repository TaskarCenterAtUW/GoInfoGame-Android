name: Gradle Android tests

on:
  push:
    branches:
      - "add-unit-tests"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  android-test:
    runs-on: [self-hosted, macOS]
    strategy:
      max-parallel: 1 # multiple runners are registered on the same physical Mac - without this,
      # matrix legs can run concurrently and contend for the same real GPU, which is what was
      # causing "Failed to find ColorBuffer" emulator errors regardless of the -gpu backend used
      matrix:
        api-level:
          - 30 # min API with arm64-v8a system images
          - 34 # close to targetSdk, well-supported arm64-v8a image
        arch:
          - arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.arch }}-${{ matrix.api-level }}-google-apis-swiftshader

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          # this is a self-hosted runner with a persistent disk (unlike GitHub-hosted runners,
          # which start every job with an empty disk) - without a name derived from the actual
          # config, the action's default fixed "test" AVD name means any future change to
          # api-level/arch/target here would silently keep reusing a stale AVD built under the
          # OLD config instead of picking up the new one, since force-avd-creation stays false
          avd-name: ci-${{ matrix.arch }}-api${{ matrix.api-level }}-google-apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching." && killall -INT crashpad_handler || true

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          avd-name: ci-${{ matrix.arch }}-api${{ matrix.api-level }}-google-apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            # screenrecord/screencap read from the virtual display buffer, so both work even
            # headless (-no-window) - stopped with SIGINT (not killed) so the mp4 container gets
            # finalized properly instead of ending up corrupt/unplayable
            adb shell screenrecord --time-limit 300 /sdcard/test-recording.mp4 &
            record_pid=$!
            ./gradlew :app:connectedDebugAndroidTest
            test_exit_code=$?
            adb exec-out screencap -p > "test-artifacts/final-screenshot-api${{ matrix.api-level }}.png"
            kill -INT $record_pid 2>/dev/null || true
            wait $record_pid 2>/dev/null || true
            sleep 2
            adb pull /sdcard/test-recording.mp4 "test-artifacts/test-recording-api${{ matrix.api-level }}.mp4" || true
            adb shell rm -f /sdcard/test-recording.mp4 || true
            # per-test screenshots written by UiTestScreenshot (one per @Test, taken in tearDown
            # before the activity closes) - app package is hardcoded to match applicationId in
            # app/build.gradle.kts, since there are no build flavors/suffixes to vary it
            adb pull /sdcard/Android/data/net.opentoall.aviv.scoutroute/files/screenshots \
              "test-artifacts/per-test-screenshots-api${{ matrix.api-level }}" || true
            killall -INT crashpad_handler || true
            exit $test_exit_code

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Instrumentation test results (API ${{ matrix.api-level }})
          path: "app/build/outputs/androidTest-results/connected/**/*.xml"
          reporter: java-junit
          fail-on-error: true

      # zipped into one file before upload - see unit-test.yml for why (many small files, mostly
      # the per-class androidTests HTML report, were timing out CreateArtifact on this runner)
      - name: Zip test reports
        if: always()
        run: |
          mkdir -p artifact-bundle
          zip -rq "artifact-bundle/android-test-reports-api${{ matrix.api-level }}.zip" \
            app/build/reports/androidTests/connected \
            app/build/outputs/androidTest-results/connected \
            test-artifacts

      # wrapped in a retry - actions/upload-artifact's FinalizeArtifact call (a small metadata
      # request made after the bytes are already uploaded) intermittently times out on this
      # runner's connection regardless of artifact size (see actions/upload-artifact#531, #623,
      # no fix from GitHub yet) - continue-on-error so exhausting retries doesn't fail the whole
      # job, since pass/fail is already reported independently via dorny/test-reporter above
      - name: Upload test reports
        uses: Wandalen/wretry.action@v3.8.0
        if: always()
        continue-on-error: true
        with:
          action: actions/upload-artifact@v4
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            name: android-test-reports-api${{ matrix.api-level }}
            path: "artifact-bundle/android-test-reports-api${{ matrix.api-level }}.zip"
            retention-days: 14
